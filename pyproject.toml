[project]
name = "abstract-planning-framework"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cffi==2.0.0",
    "clingo==5.8.0",
    "networkx==3.6.1",
    "pycparser==3.0",
    "pybind11==3.0.4",
    "unified-planning==1.3.0",
]

[project.optional-dependencies]
dev = ["black==26.5.1", "pre-commit"]

# The repository is a flat layout beside lib/ and runs/, so the packages are
# named rather than discovered.
[tool.setuptools.packages.find]
include = ["core*", "scripts*", "experiments*"]

[tool.black]
line-length = 120
target-version = ["py313"]
skip-magic-trailing-comma = true
extend-exclude = '''
/(
    experiments/plan/downward-benchmarks
  | lib
  | scripts/utils/temp
)/
'''
